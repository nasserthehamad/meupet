name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: |
          flutter --version
          echo "::notice title=Flutter::$(flutter --version | head -1)"

      - name: Gerar pasta android (flutter create)
        run: |
          flutter create --org com.meupet --project-name meupet --platforms android .
          rm -rf test
          # ID do app = pacote registrado no Firebase
          sed -i -E 's/(applicationId[ =]+")[^"]+"/\1com.meupet.app"/' android/app/build.gradle*
          # Firebase exige minSdk 23
          sed -i -E 's/flutter\.minSdkVersion/23/' android/app/build.gradle*
          # Permissão de internet e nome do app
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="meupet"/android:label="Meu Pet+"/' android/app/src/main/AndroidManifest.xml
          # Sempre em retrato (também no BlueStacks)
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          # Ligar (tel:) e abrir links
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # Notificações: ícone (patinha), cor e canal padrão
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_meupet"/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/meupet_teal"/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="meupet"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          cp -r android-src/res/* android/app/src/main/res/
          # MainActivity com os canais de notificação (SOS com som de alarme)
          MA=$(find android/app/src/main -name MainActivity.kt | head -1)
          PKG=$(grep '^package' "$MA")
          { echo "$PKG"; echo; tail -n +2 android-src/MainActivity.kt; } > "$MA.new" && mv "$MA.new" "$MA"
          head -3 "$MA"
          grep -n "screenOrientation\|queries" android/app/src/main/AndroidManifest.xml || true
          grep -n "applicationId\|minSdk" android/app/build.gradle* || true

      - name: Chave de assinatura fixa (permite atualizar o app sem desinstalar)
        run: python3 tool/fix_signing.py

      - name: Configuração do Firebase
        run: python3 tool/gen_firebase_options.py

      - name: Dependências
        run: bash tool/ci_step.sh "pub get" flutter pub get

      - name: Ícone do app
        run: bash tool/ci_step.sh "launcher icons" dart run flutter_launcher_icons

      - name: Analisar código
        run: bash tool/ci_step.sh "flutter analyze" flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Prints das telas
        id: prints
        continue-on-error: true
        run: bash tool/ci_step.sh "prints" flutter test --update-goldens screenshots_test/screens_test.dart

      - name: Publicar prints (branch prints)
        if: always()
        run: |
          if ls screenshots/*.png >/dev/null 2>&1; then
            cd screenshots
            {
              echo "# Meu Pet+ — prints do build ${{ github.run_number }}"
              echo
              echo "Geradas automaticamente com dados de exemplo a partir do commit ${{ github.sha }}."
              echo
              echo "<table>"
              i=0
              for f in *.png; do
                [ $((i % 3)) -eq 0 ] && echo "<tr>"
                echo "<td align=center><img src=\"$f\" width=260><br><sub>${f%.png}</sub></td>"
                i=$((i+1))
                [ $((i % 3)) -eq 0 ] && echo "</tr>"
              done
              echo "</table>"
            } > README.md
            git init -q -b prints
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -qm "Prints do build ${{ github.run_number }}"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prints
            echo "::notice title=Prints::$(ls *.png | wc -l) prints publicadas na branch prints"
          else
            echo "::warning title=Prints::nenhuma print gerada"
          fi

      - name: Build APK
        run: bash tool/ci_step.sh "build apk" flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Renomear
        run: cp build/app/outputs/flutter-apk/app-release.apk MeuPet.apk

      - name: Conferir assinatura (tem que ser a chave fixa)
        run: |
          python3 tool/apkcert.py MeuPet.apk | tee cert.txt
          EXPECTED=5A9E551877F7EF6828D48A7BE157533099C026E232DCF9ADBD8979FE8A87E30F
          if ! grep -q "$EXPECTED" cert.txt; then
            echo "::error title=Assinatura::APK assinado com chave diferente da fixa — atualizações não instalariam por cima"
            exit 1
          fi
          echo "::notice title=Assinatura::OK, chave fixa do Meu Pet+"

      - uses: actions/upload-artifact@v4
        with:
          name: MeuPet-apk
          path: MeuPet.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meu Pet+ build ${{ github.run_number }}
          body: "APK gerado automaticamente a partir de ${{ github.sha }}. Baixe o MeuPet.apk no celular e instale."
          files: MeuPet.apk
          make_latest: true
