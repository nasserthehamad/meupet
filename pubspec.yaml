name: meupet
description: "Meu Pet+ — um lugar onde o cuidado e o amor pela vida andam juntos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  image_picker: any
  qr_flutter: any
  video_player: any
  url_launcher: any
  geolocator: any
  firebase_messaging: any
  http: any
  file_picker: any
  record: any
  path_provider: any
  audioplayers: any
  shared_preferences: any
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  characters: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/video/
    - assets/icons/
    - assets/ui/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: CaveatBrush
      fonts:
        - asset: assets/fonts/CaveatBrush-Regular.ttf
    - family: Kaushan
      fonts:
        - asset: assets/fonts/KaushanScript-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  # Ícone sem fundo: só a casinha azul do logo oficial (fundo transparente).
  adaptive_icon_background: "assets/images/icon_bg.png"
  adaptive_icon_foreground: "assets/images/icon_fg.png"
  adaptive_icon_monochrome: "assets/images/icon_mono.png"
  min_sdk_android: 23
